<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Applies all three appearance knobs before first paint, so none of them
      flashes its default on launch: `data-theme` (which HeroUI's `dark:`
      variant and `design-tokens.css`'s per-scheme blocks both key off), plus
      `--accent`/`--accent-foreground` and `--radius`, the single CSS
      properties HeroUI derives its accent and radius scales from.

      Mirrors `src/lib/appearance.ts`, which owns these afterwards — the three
      storage keys and the option tables below must stay in sync with it by
      hand. Keep this first in <head>, before any stylesheet, so it wins the
      race.
    -->
    <script>
      try {
        var root = document.documentElement;
        var ls = window.localStorage;

        var stored = ls.getItem("ampcore-color-scheme");
        var scheme = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        root.setAttribute(
          "data-theme",
          scheme !== "auto"
            ? scheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light",
        );

        var accents = {
          blue: "oklch(0.6204 0.195 253.83)",
          violet: "oklch(0.606 0.216 292.7)",
          teal: "oklch(0.6 0.118 184.7)",
          green: "oklch(0.627 0.165 149.2)",
          amber: "oklch(0.606 0.117 66.3)",
          rose: "oklch(0.616 0.212 12.9)",
        };
        var accent = accents[ls.getItem("ampcore-accent")] || accents.blue;
        root.style.setProperty("--accent", accent);
        root.style.setProperty("--accent-foreground", "var(--snow)");

        var radii = { square: "0rem", small: "0.25rem", default: "0.5rem", large: "0.875rem" };
        root.style.setProperty("--radius", radii[ls.getItem("ampcore-radius")] || radii.default);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmpCore</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
