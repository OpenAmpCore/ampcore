<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Applies all three appearance knobs before first paint, so none of them
      flashes its default on launch: `data-theme` (which HeroUI's `dark:`
      variant and `design-tokens.css`'s per-scheme blocks both key off), plus
      `--accent`/`--accent-foreground` and `--radius`, the single CSS
      properties HeroUI derives its accent and radius scales from.

      Mirrors `src/lib/appearance.ts`, which owns these afterwards — the three
      storage keys and the option tables below must stay in sync with it by
      hand. Keep this first in <head>, before any stylesheet, so it wins the
      race.
    -->
    <script>
      try {
        var root = document.documentElement;
        var ls = window.localStorage;

        var stored = ls.getItem("ampcore-color-scheme");
        var scheme = stored === "light" || stored === "dark" || stored === "auto" ? stored : "auto";
        var resolved =
          scheme !== "auto"
            ? scheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        root.setAttribute("data-theme", resolved);
        // Page background until the stylesheet loads (dark: design-tokens.css
        // `--background`; light: HeroUI's own). `applyAppearance` clears this
        // inline value at boot so theme switches afterwards aren't pinned.
        root.style.background = resolved === "dark" ? "#0a0b0c" : "oklch(97.02% 0 0)";

        // Accent is a single hue (0-359) on a pastel HSL ColorSlider — see
        // `ACCENT_SATURATION`/`ACCENT_LIGHTNESS`/`DEFAULT_ACCENT_HUE` in
        // appearance.ts, which these three numbers must stay in sync with.
        var storedHue = Number(ls.getItem("ampcore-accent"));
        var hue = ls.getItem("ampcore-accent") !== null && isFinite(storedHue) && storedHue >= 0 && storedHue < 360 ? storedHue : 217;
        root.style.setProperty("--accent", "hsl(" + hue + " 65% 80%)");
        root.style.setProperty("--accent-foreground", "oklch(0.32 0 0)");

        var radii = { square: "0rem", small: "0.25rem", default: "0.5rem", large: "0.875rem" };
        root.style.setProperty("--radius", radii[ls.getItem("ampcore-radius")] || radii.default);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AmpCore</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
