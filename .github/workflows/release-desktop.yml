name: 'release-desktop'

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'AmpCore v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Mobile has no signing keystore set up yet (see the monorepo plan's step 0
  # notes), so this is the same unsigned debug APK android.yml's build-check
  # already builds and verifies on every push — attached here too so a
  # version tag's release carries a mobile installer alongside desktop's,
  # not a separately-signed release build. Upgrade to a real signed release
  # build once there's an Android keystore + secrets.
  release-android:
    needs: release-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: setup android sdk
        uses: android-actions/setup-android@v3
        with:
          # See android.yml for why this override is required (default
          # packages reference a removed SDK package and fail outright).
          packages: platform-tools

      - name: accept android sdk licenses
        run: yes | sdkmanager --licenses || true

      - name: install NDK
        run: sdkmanager --install "ndk;29.0.13846066"

      - name: install frontend dependencies
        run: pnpm install

      - name: init android project
        working-directory: apps/mobile
        run: pnpm exec tauri android init --ci
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      - name: build debug apk
        working-directory: apps/mobile
        run: pnpm exec tauri android build --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066

      - name: upload apk to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apps/mobile/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "AmpCore-mobile-debug-${{ github.ref_name }}.apk"
          gh release upload "${{ github.ref_name }}" "AmpCore-mobile-debug-${{ github.ref_name }}.apk" --clobber --repo "${{ github.repository }}"
